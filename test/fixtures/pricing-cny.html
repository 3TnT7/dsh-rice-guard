<!doctype html>
<!--
  手工构造的最小定价页夹具，仅用于解析回归测试。

  它不是任何网站的副本：页面结构仿照官方定价页（表头 / 模型版本行 / rowspan 合并的
  字段列），价格数值取自公开价目。之所以手写而不是抓快照，是为了不转载第三方页面，
  同时固定住解析器依赖的结构形状（第一张 table、字段名行合并、末 N 列是各模型的价）。

  测试断言见 test/pricing.test.mjs；价格变动时应先跑 scripts/update-pricing.mjs。
-->
<html lang="zh-CN">
<head><meta charset="utf-8"><title>模型与价格（测试夹具）</title></head>
<body>
<p>以下为用于测试的最小价目表。</p>
<table>
  <thead>
    <tr><th>模型</th><th>deepseek-flash</th><th>deepseek-v4-pro</th></tr>
    <tr><th>模型版本</th><td>DeepSeek-V4.1-Flash-1017</td><td>DeepSeek-V4-Pro-0813</td></tr>
  </thead>
  <tbody>
    <tr><td rowspan="2">缓存命中</td><td>空闲时段</td><td>0.02</td><td>0.15</td></tr>
    <tr><td>高峰时段</td><td>0.04</td><td>0.3</td></tr>
    <tr><td rowspan="2">缓存未命中</td><td>空闲时段</td><td>1</td><td>4.5</td></tr>
    <tr><td>高峰时段</td><td>2</td><td>9</td></tr>
    <tr><td rowspan="2">输出</td><td>空闲时段</td><td>4</td><td>13.5</td></tr>
    <tr><td>高峰时段</td><td>8</td><td>27</td></tr>
  </tbody>
</table>
<p>高峰时段为北京时间周一至周五 9:00 - 12:00、14:00 - 18:00，其余时段为空闲时段。</p>
</body>
</html>
